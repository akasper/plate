[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plate-core"
version = "0.8.7"
description = "Product Lifecycle Automation Toolkit and Engine (PLATE): core library, gh extension, and MCP server for GitHub-native methodology automation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Andrew Kasper"}
]
license = {text = "MIT with Commons Clause"}
dependencies = ["pyyaml>=6"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
plate-mcp = "plate_core.mcp_server:run"

[project.urls]
Homepage = "https://github.com/akasper/plate"
Repository = "https://github.com/akasper/plate"
Documentation = "https://github.com/akasper/plate/blob/main/README.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"plate_core" = [
  "data/*.yml",
  "data/*.json",
  "template_payload/**/*",
  "template_payload/.github/**/*",
  "template_payload/.agentic/**/*",
]
