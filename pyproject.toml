[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plate-core"
version = "0.5.3"
description = "PLATE core library, gh extension entrypoint, and MCP server for GitHub project methodology automation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Andrew Kasper"}
]
license = {text = "MIT with Commons Clause"}
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
plate-mcp = "plate_core.mcp_server:run"

[project.urls]
Homepage = "https://github.com/akasper/plate"
Repository = "https://github.com/akasper/plate"
Documentation = "https://github.com/akasper/plate/blob/main/README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"plate_core" = ["data/*.yml", "data/*.json", "template_payload/**/*"]
