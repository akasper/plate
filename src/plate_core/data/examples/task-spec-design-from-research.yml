task_spec_version: "1.0"
id: feature-requirements-from-research
role: designer
kind: Design
level: staff
route: feature
inputs:
  - id: research_doc
    type: file_path
    required: true
  - id: epic_milestone
    type: string
    required: false
outputs:
  - id: design_doc
    type: file_path
    description: docs/design/<slug>.md
acceptance:
  checks:
    - design doc lists scope, constraints, and acceptance criteria
    - out-of-scope section names deferred work
  success_signal: Design artifact ready for Feature stub refinement
tools:
  profiles:
    - delegation
    - design
  allow:
    - plate_artifact_propose
model_policy:
  tiers:
    - T2
    - T3
  start_tier: T3
  max_cost_usd: 2.0
  t3_requires_approval: human
approval: human-t3
budget:
  max_tokens_per_run: 120000
next: []
