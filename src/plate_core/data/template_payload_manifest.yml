schema_version: 2

# Files selected into the canonical template payload used for downstream scaffolding.
include_globs:
  - ".agentic/**"
  - ".github/**"
  - "docs/**"
  - "scripts/**"
  - "tests/e2e/**"
  - "tests/README.md"
  - "AGENTS.md"
  - "CHANGELOG.md"
  - "CONTRIBUTING.md"
  - "README.md"
  - "SPEC.md"
  - "package.json"
  - "playwright.config.ts"

# Local-only test media and spikes — not shipped to downstream adopters (#1152).
exclude_globs:
  - "tests/spike-videos/**"
  - "tests/e2e/fixtures/gifs/*.gif"
  - "tests/e2e/fixtures/gifs/*.webm"
  - "tests/e2e/fixtures/gifs/*.mp4"
  - "tests/e2e/fixtures/gifs/*.png"

# Payload files are scaffolding assets to be copied into adopting repositories.
copy_to_downstream_globs:
  - "**"

# No files in this payload should be consumed as plate runtime-only config.
tool_runtime_only_globs: []

# Per-path conflict strategies for adoption (#617). First match wins.
# on_conflict: skip | overwrite | conflict | install_as | preserve_existing
path_rules:
  - globs:
      - ".github/workflows/ci.yml"
    on_conflict: install_as
    install_as: ".github/workflows/plate-ci.yml"
    reason: "Preserve product CI; install PLATE process workflow as plate-ci.yml"
  - globs:
      - "package.json"
      - "playwright.config.ts"
      - "README.md"
      - "CHANGELOG.md"
      - "SPEC.md"
    on_conflict: conflict
    reason: "Root product files need human merge; do not clobber"
  - globs:
      - ".github/labels.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
    on_conflict: overwrite
    reason: "PLATE taxonomy/templates are safe to refresh on adopt"
  - globs:
      - "AGENTS.md"
      - ".github/CODEOWNERS"
    on_conflict: conflict
    reason: "May contain local customizations; review before replace"
  - globs:
      - ".agentic/COSTS.md"
    on_conflict: preserve_existing
    reason: "Repository cost history must not be overwritten by bootstrap or adopt"
