process:
  name: "Process Lifecycle Agentic Task Engine"
  short_name: "PLATE"
  version: "0.6"
  template_repository: "akasper/plate_template"
  authority_model:
    doctrine_source: "PLATE book or governing methodology document"
    template_artifact_source: "this repository"
    conflict_resolution: "Open a corrective issue or pull request; avoid duplicating fast-changing artifacts in long-form prose."

principles:
  - "Humans keep judgment."
  - "Agents do the toil."
  - "GitHub preserves truth."
  - "Labels are stable metadata, not decoration."
  - "GitHub Projects fields carry frequently changing planning state."
  - "Template artifacts should live in the repository rather than duplicated book appendices."

artifacts:
  spec: "SPEC.md"
  current_state: ".agentic/releases/"
  release_notes: ".agentic/releases/"
  agent_rules: "AGENTS.md"
  process_config: ".agentic/process.yml"
  skills_registry: ".agentic/skills.yml"
  extensions_registry: ".agentic/extensions.yml"
  audit_config: ".agentic/audit.yml"
  traceability_config: ".agentic/traceability.yml"
  marketing_config: ".agentic/marketing.yml"
  migration_config: ".agentic/migration.yml"

  labels: ".github/labels.yml"
  issue_templates: ".github/ISSUE_TEMPLATE"
  pull_request_template: ".github/PULL_REQUEST_TEMPLATE.md"
  tests: "tests"
  wiki_source_candidates:
    - "docs/wiki"
    - ".agentic/releases/"
    - "docs/features"

labels:
  prefix_convention:
    area: "area:"
    risk: "risk:"
    need: "need:"
  disallowed_default_prefixes:
    - "priority:"
    - "status:"
  planning_state_rule: "Use GitHub Projects fields for priority, status, owner, target date, iteration, rank, and release target."
  issue_type_labels:
    required_exactly_one:
      - "Bug"
      - "Feature"
      - "Epic"
      - "Release"
      - "Research"
      - "Design"
      - "Question"
      - "Task"
      - "Audit"
      - "Migration"
  # Semver track labels (Major/Minor/Patch) are used on changing issues (Feature, Bug, Documentation, etc.) to declare target release track and drive landing on release-major/minor/patch branches. They are not a "type" but a stable planning signal for the release model (see release-ceremony-refinement design). They are registered in .github/labels.yml alongside area:/risk:/need: labels.
  pull_request_type_labels:
    required_exactly_one:
      - "Bug"
      - "Feature"
      - "Documentation"
      - "Feedback Response"
  release_rules:
    branch_model:
      # Refined multi-track model (see docs/design/release-ceremony-refinement.md and AGENTS.md §Branch Model).
      # Legacy single "release" supported during transition.
      epic_branch_pattern: "epic/<short-name>"
      next_release_branches:
        - "release-major"
        - "release-minor"
        - "release-patch"
      versioned_release_branch_pattern: "release-vX.Y.Z"
      main_branch: "main"
      flow: "work receives Major/Minor/Patch label + targets matching release-{major,minor,patch} (permissive next- integration) → packaging (freeze, version lock, versioned release-vX.Y.Z branch created by combining tracks as needed, standing Next Release issue renamed, fresh Next Release spawned) → Release PR (versioned branch → main, heavy CI) → finalization (tag + .plate triggers + next Next Release) → main + tag"
    epic_close_ceremony:
      - "All child Feature/Bug issues closed."
      - "Work funneled via track label into the appropriate next- release branch (or legacy release branch)."
      - "Open PR from epic/<name> (or track-equivalent) into the target release branch."
      - "PR reviewed and squash-merged."
    release_ceremony:
      - "Standing 'Next Release' issue exists and is the target for Epics (sidebar links) and track-labeled work."
      - "Packaging: determine semver, create versioned branch (combining tracks), rename Next Release issue to vX.Y.Z, immediately create fresh Next Release issue."
      - "Open Release PR from versioned branch → main (labeled Documentation; carries Release context for heavy CI). Include Closes #N."
      - "PR reviewed and approved."
      - "Squash-merge PR into main."
      - "Finalization: PLATE performs git tag vX.Y.Z; kicks configurable downstream triggers (from .plate/ + extensions/release_checks); ensures next Next Release issue exists."
      - "Create GitHub Release from the tag (auto-populated from notes)."
      - "Hard-reset the versioned (or originating next-/legacy release) branch to the tag as appropriate: git checkout <branch> && git reset --hard vX.Y.Z && git push --force-with-lease"
    fragment_contract:
      source_dir: ".agentic/releases/unreleased/"
      versioned_dir: ".agentic/releases/vX.Y.Z/"
      required_for: "Feature PRs that change PLATE process, templates, or agent surfaces"
      aggregated_by: "gh plate release cut vX.Y.Z"
    extension_hook_surface:
      field: "release_checks"
      location: ".agentic/extensions.yml"
      surfaced_by: "gh plate release status"
  epic_rules:
    milestones_are_canonical_epics: true
    every_feature_issue_has_epic_milestone: true
    epic_issue_requires_milestone_when_used: true
    create_new_epic_labels: false
  stable_metadata_rule: "Create labels only when they change routing, enforcement, reporting, auditing, review burden, or agent behavior."

issues:
  required_for_feature:
    - "Feature label"
    - "epic milestone"
    - "problem statement"
    - "desired behavior"
    - "acceptance criteria"
    - "test expectations"
    - "documentation impact"
  required_for_bug:
    - "Bug label"
    - "reproduction or need:reproduction label"
    - "expected behavior"
    - "actual behavior"
    - "regression test plan"
  required_for_epic:
    - "Epic label"
    - "matching epic milestone"
    - "outcome"
    - "scope boundaries"
    - "success criteria"
  required_for_release:
    - "Release label"
    - "release milestone"
    - "target version or standing Next Release title"
    - "pre-release checklist"
  required_for_research:
    - "Research label"
    - "research question"
    - "decision criteria"
    - "expected output"
  required_for_question:
    - "Question label"
    - "information goal"
    - "answer signal"
    - "required git artifact"
  required_for_task:
    - "Task label"
    - "human action required"
    - "why the agent cannot safely proceed"
    - "context and affected artifacts"
    - "best-effort instructions"
    - "done signal"
    - "related links"
  required_for_audit:
    - "Audit label"
    - "source audit"
    - "expected state"
    - "actual drift"
    - "proposed correction"

pull_requests:
  required_type_labels:
    - "Bug"
    - "Feature"
    - "Documentation"
    - "Feedback Response"
  feature_pr_requires_current_md: false
  feature_pr_requires_release_change_file: true
  issue_link_required_for:
    - "Bug"
    - "Feature"
    - "Documentation"
  accepted_issue_link_methods:
    - "closing keyword in PR body"
    - "Development sidebar link"
  milestone_expected_when_part_of_epic: true
  milestone_enforcement_status: "warning_first"
  milestone_warning_first_for:
    - "Bug"
    - "Feature"
    - "Documentation"
  required_sections:
    - "Summary"
    - "Linked work"
    - "Change type label"
    - "Tests and evidence"
    - "Documentation and traceability"
    - "Risk and rollback"
    - "Agent self-review"
  human_merge_required: true

workflows:
  label_check:
    name: "PLATE Label Check"
    path: ".github/workflows/label-check.yml"
    required: true
  pr_title_check:
    name: "PLATE PR Title Check"
    path: ".github/workflows/pr-title-check.yml"
    required: true
  question_handling:
    name: "Question Handling"
    path: ".github/workflows/question-handling.yml"
    required: true
  pr_documentation_check:
    name: "PR Documentation Check"
    path: ".github/workflows/pr-documentation-check.yml"
    required_for_feature_prs: true
  sync_wiki_on_merge:
    name: "Sync to Wiki on Merge"
    path: ".github/workflows/sync-wiki-on-merge.yml"
    trigger: "merged Feature pull request"
    default_enabled: false
    enablement_variable: "PLATE_WIKI_SYNC_ENABLED"
    required_secret_when_enabled: "WIKI_TOKEN"
    safety_model_status: "conservative_scoped_opt_in"
  ci:
    name: "CI"
    path: ".github/workflows/ci.yml"
  audit:
    name: "PLATE Audit"
    path: ".github/workflows/audit.yml"
  release:
    name: "Release"
    path: ".github/workflows/release.yml"
    notes_source: ".agentic/releases/"
    # Refined model adds differentiated heavy CI jobs (in ci.yml or companion) gated on Release label or release-*/release-v* branch targets, plus label-check + PR milestone enforcement updates. See design doc.

audit:
  cadence: "weekly_or_pre_release"
  drift_targets:
    - "SPEC.md"
    - ".agentic/releases/"
    - "issues"
    - "pull requests"
    - "tests"
    - "wiki"
    - "labels"
    - "workflows"
    - "marketing claims"
  output_directory: "docs/audits"

open_design_items:
  - "Replace generated-project placeholder CI commands with stack-specific build/lint/test commands when runtime manifests are added."
  - "Define project-specific wiki page map before enabling broad wiki synchronization."
  - "Create running example projects outside the book appendices and keep them versioned in repositories."
