name: PLATES Agentic Orchestrator

on:
  issues:
    types: [closed, reopened, labeled, unlabeled]

jobs:
  orchestrate:
    if: |
      github.event.issue != null && !github.event.issue.pull_request && (
        github.event.action == 'closed' ||
        github.event.action == 'reopened' ||
        (github.event.action == 'labeled' && contains(fromJSON('["status:ready-to-work","status:blocked"]'), github.event.label.name)) ||
        (github.event.action == 'unlabeled' && contains(fromJSON('["status:ready-to-work","status:blocked"]'), github.event.label.name))
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Handle blocker resolution and ready-to-work
