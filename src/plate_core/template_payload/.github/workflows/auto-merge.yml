name: Auto-merge lightweight PRs

# Triggered when a PR receives the 'auto-merge' label.
# Requires the opt-in .github/AUTONOMOUS_MODE marker on the default branch and
# exactly risk:low on the PR (#1262 item 7; template AGENTS.md Autonomous Mode).
# The PR must still satisfy all branch protection rules before GitHub
# will complete the merge.

on:
  pull_request:
    types: [labeled]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name || github.event.action }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: github.event.label.name == 'auto-merge'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Check autonomous mode marker and risk:low
        id: check
        uses: actions/github-script@v8
        with:
          script: |
            let active = false;
            try {
              await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: '.github/AUTONOMOUS_MODE',
                ref: context.payload.repository.default_branch,
              });
              active = true;
            } catch (e) {
              core.warning('Autonomous mode is not active (missing .github/AUTONOMOUS_MODE on the default branch). Skipping auto-merge.');
            }
            try {
              const prLabels = (context.payload.pull_request && context.payload.pull_request.labels) || [];
              const riskLabels = prLabels.filter(l => l.name && l.name.toLowerCase().startsWith('risk:'));
              if (active) {
                if (riskLabels.length !== 1 || riskLabels[0].name.toLowerCase() !== 'risk:low') {
                  active = false;
                  const found = riskLabels.map(l => l.name).join(', ') || '(none)';
                  core.warning(`Blocking auto-merge: requires exactly risk:low; found ${found}.`);
                }
              }
            } catch (e) {
              active = false;
              core.warning('Could not validate PR risk label: ' + e.message);
            }
            core.setOutput('active', active ? 'true' : 'false');

      - name: Enable auto-merge
        if: steps.check.outputs.active == 'true'
        run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
