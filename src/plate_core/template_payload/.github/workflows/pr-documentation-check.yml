name: PR Documentation Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  feature-change-files:
    runs-on: ubuntu-latest
    steps:
      - name: Determine whether this is a Feature PR
        id: labels
        uses: actions/github-script@v8
        with:
          script: |
            const labels = context.payload.pull_request.labels.map((label) => label.name);
            const isFeature = labels.includes('Feature');
            core.setOutput('is_feature', String(isFeature));
            core.info(`Feature PR: ${isFeature}`);
      - name: Check whether per-feature change files changed
        if: steps.labels.outputs.is_feature == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const changed = files.map((file) => file.filename);
            core.info(`Changed files:\n${changed.join('\n')}`);
            const hasFragment = changed.some(
              (file) =>
                file.startsWith('.agentic/releases/unreleased/') &&
                file.endsWith('.json')
            );
            const hasLegacyFile = changed.some(
              (file) =>
                file.startsWith('.agentic/releases/') &&
                !file.startsWith('.agentic/releases/unreleased/') &&
                file.endsWith('.json')
            );
            const hasReleaseChangeFile = hasFragment || hasLegacyFile;
            if (!hasReleaseChangeFile) {
              core.setFailed(
                'Feature pull requests must include a release fragment in .agentic/releases/unreleased/<slug>.json. ' +
                'See .agentic/releases/unreleased/README.md for the required schema. ' +
                'If this PR is not a Feature, remove the Feature label.'
              );
            }
      - name: Skip non-Feature PR
        if: steps.labels.outputs.is_feature != 'true'
        run: echo "Not a Feature PR; release fragment in .agentic/releases/unreleased/ is not required by this check."
