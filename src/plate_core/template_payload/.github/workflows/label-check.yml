name: PLATE Issue Label Check

on:
  issues:
    types: [opened, labeled, unlabeled, reopened, milestoned, demilestoned]

permissions:
  contents: read
  issues: read

jobs:
  check-labels:
    if: github.event.issue != null && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Validate PLATE issue label rules
        uses: actions/github-script@v8
        with:
          script: |
            const issueTypeLabels = ['Bug', 'Feature', 'Epic', 'Release', 'Research', 'Design', 'Question', 'Task', 'Audit', 'Migration', 'Feedback Response', 'Spike'];
            const requiresMilestone = ['Feature', 'Epic', 'Release'];
            const allowedStatusLabels = ['status:stub', 'status:blocked', 'status:ready-to-work', 'status:implemented'];
            const allowedTierLabels = ['tier:T0', 'tier:T1', 'tier:T2', 'tier:T3'];
            const issue = context.payload.issue;

            if (!issue) {
              core.info('No issue payload found.');
              return;
            }

            const labels = (issue.labels || []).map((label) => typeof label === 'string' ? label : label.name);
            const forbiddenPlanningLabels = labels.filter((label) => {
              if (/^priority:/.test(label)) {
                return true;
              }
              if (/^status:/.test(label)) {
                return !allowedStatusLabels.includes(label);
              }
              return false;
            });
            const milestoneTitle = issue.milestone?.title || '(none)';
            core.info(`Labels: ${labels.join(', ') || '(none)'}`);
            core.info(`Milestone: ${milestoneTitle}`);

            if (forbiddenPlanningLabels.length > 0) {
              core.setFailed(`PLATE repositories should use GitHub Projects fields for planning state, not labels: ${forbiddenPlanningLabels.join(', ')}.`);
              return;
            }

            const tierMatches = labels.filter((label) => allowedTierLabels.includes(label));
            const invalidTierLabels = labels.filter((label) => /^tier:/.test(label) && !allowedTierLabels.includes(label));
            if (invalidTierLabels.length > 0) {
              core.setFailed(`Unsupported tier labels (${invalidTierLabels.join(', ')}). Allowed optional tier labels: ${allowedTierLabels.join(', ')}.`);
              return;
            }
            if (tierMatches.length > 1) {
              core.setFailed(`At most one optional tier label is allowed (${allowedTierLabels.join(', ')}). Found: ${tierMatches.join(', ')}.`);
              return;
            }

            const matches = labels.filter((label) => issueTypeLabels.includes(label));
            if (matches.length !== 1) {
              core.setFailed(`Issues must have exactly one PLATE issue type label (${issueTypeLabels.join(', ')}). Found: ${matches.join(', ') || '(none)'}.`);
              return;
            }

            if (requiresMilestone.includes(matches[0]) && !issue.milestone) {
              const message = matches[0] === 'Release'
                ? 'Release issues must be assigned to a GitHub milestone.'
                : `${matches[0]} issues must be assigned to a GitHub milestone representing the Epic.`;
              core.setFailed(message);
              return;
            }

            core.info('PLATE issue label rules passed.');
