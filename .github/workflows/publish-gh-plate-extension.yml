name: Publish gh-plate thin shim (PLATE-CORE-PUBLISHING-ONLY)

# PLATE-CORE-PUBLISHING-ONLY
# ============================================================
# This workflow maintains the separate akasper/gh-plate thin repository
# so that `gh extension install akasper/gh-plate` works and satisfies
# GitHub CLI's "extension name must start with gh-" rule.
#
# THIS IS SPECIFIC INFRASTRUCTURE FOR PUBLISHING THE OFFICIAL
# plate_core / akasper/plate gh CLI extension surface.
#
# IT IS NOT PART OF THE PLATE METHODOLOGY.
# IT IS NOT PART OF AGENTS.md, THE GENERAL RELEASE CEREMONY,
# OR ANYTHING DOWNSTREAM PLATE ADOPTERS SHOULD COPY OR CARE ABOUT.
#
# Do not sync this file (or the logic it contains) into
# src/plate_core/template_payload/.github/workflows/
# or treat it as reusable PLATE process or template content.
#
# The thin repo (akasper/gh-plate) is a minimal shim whose only job
# is to host the launcher script. All real code, the plate-core PyPI
# package, MCP, plugins, etc. live in the main akasper/plate repo.
#
# #613: Runs after plate tags are pushed (Release PR merge → tag on main)
# and ensures matching tag + GitHub Release on gh-plate (idempotent).
# ============================================================

on:
  # Trigger after the normal release ceremony has produced a tag on main.
  push:
    tags:
      - 'v*'
  # Manual recovery / re-sync for a version.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. v0.1.2). If omitted, derived from tag or current checkout.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  sync-shim:
    # Only run on the real main repo, not forks.
    if: github.repository == 'akasper/plate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo at the release ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            # Prefer the tag name when triggered by tag push.
            VER="${GITHUB_REF#refs/tags/}"
          fi
          # Normalize to vX.Y.Z
          case "$VER" in
            v*) ;;
            *) VER="v${VER}" ;;
          esac
          BARE="${VER#v}"
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "bare=$BARE" >> $GITHUB_OUTPUT
          echo "Publishing shim for $VER (bare=$BARE)"

      - name: Checkout the thin shim repo (using deploy token with write to the thin repo only)
        uses: actions/checkout@v4
        with:
          repository: akasper/gh-plate
          token: ${{ secrets.THIN_SHIM_DEPLOY_TOKEN }}   # Fine-grained PAT or GitHub App token scoped only to the gh-plate repo, contents:write
          path: thin-shim
          fetch-depth: 0

      - name: Sync launcher + version markers
        run: |
          set -euo pipefail
          # The root gh-plate in this repo is the source of truth for the launcher.
          cp gh-plate thin-shim/gh-plate
          chmod +x thin-shim/gh-plate

          VER="${{ steps.version.outputs.version }}"
          BARE="${{ steps.version.outputs.bare }}"
          # VERSION + PLATE_CORE_VERSION markers power version lock (#614).
          echo "$VER" > thin-shim/VERSION
          echo "$BARE" > thin-shim/PLATE_CORE_VERSION
          echo "Synced launcher + VERSION=$VER PLATE_CORE_VERSION=$BARE"

      - name: Verify executable bit (critical for gh extension runtime)
        run: |
          set -euo pipefail
          if [ ! -x thin-shim/gh-plate ]; then
            echo "ERROR: gh-plate is not executable after copy+chmod. This will cause 'permission denied' on 'gh plate' after install."
            ls -l thin-shim/gh-plate
            exit 1
          fi
          echo "Verified: thin-shim/gh-plate is executable"

      - name: Commit and push to the thin repo (if changed)
        working-directory: thin-shim
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --chmod=+x gh-plate
          git add VERSION PLATE_CORE_VERSION
          if git diff --cached --quiet; then
            echo "No content changes for ${{ steps.version.outputs.version }}; continuing to ensure tag/release."
          else
            git commit -m "Sync gh-plate launcher for ${{ steps.version.outputs.version }} (matches plate-core ${{ steps.version.outputs.bare }})"
            git push origin HEAD:main
            echo "Pushed sync commit to gh-plate main."
          fi

      - name: Ensure matching tag on gh-plate (idempotent, no force-move)
        working-directory: thin-shim
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin --tags
          if git ls-remote --tags origin "refs/tags/${VER}" | grep -q .; then
            echo "Tag ${VER} already exists on gh-plate; leaving immutable."
          else
            # Tag current HEAD (synced main tip)
            git checkout main 2>/dev/null || git checkout -B main origin/main
            git pull --ff-only origin main || true
            git tag "${VER}"
            git push origin "refs/tags/${VER}"
            echo "Created tag ${VER} on gh-plate."
          fi

      - name: Ensure GitHub Release on gh-plate (idempotent)
        working-directory: thin-shim
        env:
          GH_TOKEN: ${{ secrets.THIN_SHIM_DEPLOY_TOKEN }}
          VER: ${{ steps.version.outputs.version }}
          BARE: ${{ steps.version.outputs.bare }}
        run: |
          set -euo pipefail
          # Skip if release already exists
          if gh release view "${VER}" --repo akasper/gh-plate >/dev/null 2>&1; then
            echo "GitHub Release ${VER} already exists on gh-plate."
            exit 0
          fi
          NOTES=$(cat <<EOF
          ## gh-plate ${VER}

          Thin GitHub CLI extension shim matching **plate-core ${BARE}**.

          - Install pin: \`gh extension install akasper/gh-plate@${VER}\`
          - Runtime pins \`plate-core==${BARE}\` via VERSION / PLATE_CORE_VERSION (#614)
          - Source: [akasper/plate ${VER}](https://github.com/akasper/plate/releases/tag/${VER})

          Automated by plate workflow publish-gh-plate-extension.yml (#613).
          EOF
          )
          # gh release create fails if tag missing; tag step above ensures it
          if gh release create "${VER}" \
              --repo akasper/gh-plate \
              --title "gh-plate ${VER}" \
              --notes "${NOTES}"; then
            echo "Created GitHub Release ${VER} on gh-plate."
          else
            echo "WARNING: gh release create failed (non-fatal if race/exists)."
            gh release view "${VER}" --repo akasper/gh-plate || true
          fi

      - name: Summary
        run: |
          echo "gh-plate thin shim sync complete for version ${{ steps.version.outputs.version }}."
          echo "Users: gh extension install akasper/gh-plate@${{ steps.version.outputs.version }}"
          echo "See #613, #614, #599 for isolation rules."
