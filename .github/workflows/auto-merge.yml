name: Auto-merge lightweight PRs

# Triggered when a PR receives the 'auto-merge' label.
# Only merges if .plate autonomy.risk_tolerance != "off" (or legacy .github/AUTONOMOUS_MODE for transition).
# This generalizes the old marker-file gate per Epic #470 / #476 (core philosophy: autonomous by default unless 'off' in .plate config).
# The PR must still satisfy all branch protection rules before GitHub
# will complete the merge.

on:
  pull_request:
    types: [labeled]

jobs:
  auto-merge:
    if: github.event.label.name == 'auto-merge'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Check autonomous mode is active (prefer .plate autonomy.risk_tolerance)
        id: check
        uses: actions/github-script@v8
        with:
          script: |
            let active = false;
            let tol = 'off';
            // Prefer .plate config (new declarative source per #470 refinement, sunsetting AUTONOMOUS_MODE)
            try {
              const plateContent = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: '.plate',
                ref: context.payload.repository.default_branch,
              });
              // .plate file is present (get succeeded). Even if JSON parse fails or autonomy key absent/invalid, treat as explicit present: do NOT fall back to legacy per safety review.
              plateAutonomyPresent = true;
              const plate = JSON.parse(Buffer.from(plateContent.data.content, 'base64').toString());
              const auto = plate.autonomy;
              // Mark presence of explicit autonomy section (even if disabled/off) so we do not fall through to legacy.
              // Absent autonomy section (or no .plate) falls through to legacy .github/AUTONOMOUS_MODE check only.
              // This matches #470/#476: absent = no new auto behavior; legacy marker is compat path (low only).
              // Explicit .plate autonomy (enabled:false or risk_tolerance:off) must disable, overriding legacy.
              // present-but-invalid .plate (parse error or bad autonomy) also disables (no legacy fallback).
              if (auto && typeof auto === 'object') {
                if (auto.enabled !== false) {
                  const rt = (auto.risk_tolerance || '').toLowerCase().trim();
                  if (rt && rt !== 'off') {
                    tol = rt;
                    active = true;
                  }
                }
              }
            } catch (e) {
              // get or parse failed. If plateAutonomyPresent was set (get succeeded, bad JSON etc) we keep present=true and skip legacy below.
              // Only if get failed (no .plate file) do we fall through.
            }
            if (!active) {
              // Legacy compat during transition (will be removed after migration)
              try {
                await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: '.github/AUTONOMOUS_MODE',
                  ref: context.payload.repository.default_branch,
                });
                active = true;
                tol = 'low';  // legacy equivalent to risk:low only
              } catch (e) {
                core.warning('Autonomous mode is not active (no .plate or autonomy.enabled==false or risk_tolerance=="off", and no legacy .github/AUTONOMOUS_MODE). Skipping auto-merge.');
              }
            }
            // Enforce PR risk label <= tol (never allow critical)
            const riskRank = { 'low': 1, 'medium': 2, 'high': 3, 'critical': 4 };
            const prRisk = (context.payload.pull_request.labels || []).find(l => l.name.startsWith('risk:'));
            if (prRisk) {
              const prRank = riskRank[prRisk.name.split(':')[1]] || 0;
              const tolRank = riskRank[tol] || 0;
              if (prRisk.name.includes('critical') || prRank > tolRank) {
                active = false;
                core.warning(`PR risk ${prRisk.name} exceeds configured tolerance ${tol}; blocking auto-merge.`);
              }
            }
            core.setOutput('active', active ? 'true' : 'false');

      - name: Enable auto-merge
        if: steps.check.outputs.active == 'true'
        run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
