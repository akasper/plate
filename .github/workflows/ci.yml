name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m unittest discover -s tests -p "test_*.py"

      - name: Install Copilot CLI
        run: |
          set -euo pipefail
          # Pinned to 1.0.60+ for non-interactive deprecation handling (direct/local installs deprecated by Copilot CLI; see #375).
          COPILOT_VERSION="1.0.60"
          curl -fsSL -o copilot-linux-x64.tar.gz "https://github.com/github/copilot-cli/releases/download/v${COPILOT_VERSION}/copilot-linux-x64.tar.gz"
          tar -xzf copilot-linux-x64.tar.gz
          chmod +x copilot
          sudo mv copilot /usr/local/bin/copilot
          copilot --version

      - name: Plugin install smoke test (pre-launch marketplace surface)
        run: |
          set -euo pipefail
          copilot plugin marketplace add akasper/plate
          copilot plugin install plate-core@plate-marketplace
          copilot plugin uninstall plate-core
          copilot plugin marketplace remove plate-marketplace --force

      - name: Plugin skill surface sync check (SKILLS.md + SKILL.md)
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python3 scripts/generate-plugin-skills.py --check

      - name: Grok marketplace packaging check (generator + committed index)
        run: |
          set -euo pipefail
          # Vendored generator (see scripts/generate-grok-plugin-index.py) validates
          # .grok-plugin/marketplace.json + scans .plugin/ payload into plugin-index.json.
          # This ensures `grok plugin marketplace add akasper/plate` will show rich previews.
          python3 scripts/generate-grok-plugin-index.py --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright and dependencies
        run: npm install
        working-directory: tests/e2e

      - name: Run Playwright e2e tests
        run: npx playwright test
        working-directory: tests/e2e
        env:
          WORKSPACE: ${{ github.workspace }}

  validate-release-pr:
    needs: test
    if: |
      github.event_name == 'pull_request' && (
        contains(github.event.pull_request.labels.*.name, 'Release') ||
        github.head_ref == 'release' ||
        startsWith(github.head_ref, 'release-v')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release workspace version
        id: release-version
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          from plate_core.release import validate_release_workspace

          report = validate_release_workspace(Path(os.environ["GITHUB_WORKSPACE"]))
          print(json.dumps(report.to_dict(), indent=2))
          if report.errors:
              print("\n".join(report.errors), file=sys.stderr)
              raise SystemExit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"release_version={report.release_version}\n")
              fh.write(f"release_tag={report.release_tag}\n")
          PY

      - name: Fail if remote release tag already exists
        env:
          RELEASE_TAG: ${{ steps.release-version.outputs.release_tag }}
        run: |
          set -euo pipefail
          if git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | grep -q .; then
            echo "Release tag ${RELEASE_TAG} already exists on origin."
            exit 1
          fi

  # Release ceremony refinement: differentiated heavy CI for Release PRs / stabilization contexts.
  # These jobs run *after* the lightweight gates (the test job above acts as a common fast-fail).
  # They activate for release packaging/stabilization PRs targeting the legacy 'release' branch
  # or release-* / release-v* branches (multi-track or versioned cuts).
  # The 'Release' label (in addition to 'Documentation' PR type) is required on Release PRs
  # (and for legacy 'release' head_ref) to prevent skips in these jobs (see #532).
  # Add expensive steps here: expanded e2e matrix, security scans (trivy/snyk/etc.), architecture
  # review / lint, full recompilation + packaging for all targets, etc.
  # Normal development to the permissive next-* branches stays on the lightweight path.
  heavy-release:
    needs:
      - test
      - validate-release-pr
    if: |
      github.head_ref == 'release' ||
      startsWith(github.head_ref, 'release-') ||
      startsWith(github.base_ref, 'release-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Heavy release context detected
        run: |
          echo "This PR is in release packaging/stabilization context via release-*/release-v* branches."
          echo "Run expensive steps here (full builds, security, extra e2e, architecture review, packaging...)."
          echo "Remember common gateway fast-fails earlier in the job or previous jobs."
      # TODO in implementation slices: add real heavy steps (matrix, security action, etc.)
      # Keep this job fast-failing and clearly separated so normal CI remains cheap.