name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m unittest discover -s tests -p "test_*.py"

      - name: Install Copilot CLI
        run: |
          set -euo pipefail
          COPILOT_VERSION="1.0.60"
          curl -fsSL -o copilot-linux-x64.tar.gz "https://github.com/github/copilot-cli/releases/download/v${COPILOT_VERSION}/copilot-linux-x64.tar.gz"
          tar -xzf copilot-linux-x64.tar.gz
          chmod +x copilot
          sudo mv copilot /usr/local/bin/copilot
          copilot --version

      - name: Plugin install smoke test (workspace path)
        run: |
          set -euo pipefail
          copilot plugin install "$GITHUB_WORKSPACE"
          copilot plugin uninstall plate-core

      - name: Plugin install smoke test (pre-launch marketplace surface)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          copilot plugin marketplace add akasper/plate
          copilot plugin install plate-core@plate-marketplace
          copilot plugin uninstall plate-core
          copilot plugin marketplace remove plate-marketplace --force

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright and dependencies
        run: npm install
        working-directory: tests/e2e

      - name: Run Playwright e2e tests
        run: npx playwright test
        working-directory: tests/e2e
        env:
          WORKSPACE: ${{ github.workspace }}

  # Release ceremony refinement: differentiated heavy CI for Release PRs / stabilization contexts.
  # These jobs run *after* the lightweight gates (the test job above acts as a common fast-fail).
  # They activate for PRs labeled "Release" or targeting release-* / release-v* branches.
  # Add expensive steps here: expanded e2e matrix, security scans (trivy/snyk/etc.), architecture
  # review / lint, full recompilation + packaging for all targets, etc.
  # Normal development to the permissive next-* branches stays on the lightweight path.
  heavy-release:
    needs: test
    if: |
      contains(github.event.pull_request.labels.*.name, 'Release') ||
      startsWith(github.head_ref, 'release-') ||
      startsWith(github.base_ref, 'release-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Heavy release context detected
        run: |
          echo "This is a Release-labeled PR or targets a release-*/release-v* branch."
          echo "Run expensive steps here (full builds, security, extra e2e, architecture review, packaging...)."
          echo "Remember common gateway fast-fails earlier in the job or previous jobs."
      # TODO in implementation slices: add real heavy steps (matrix, security action, etc.)
      # Keep this job fast-failing and clearly separated so normal CI remains cheap.