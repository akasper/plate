name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

# Mutable action pins (see .github/dependabot.yml for scheduled updates).
env:
  ACTIONS_CHECKOUT_SHA: 11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
  ACTIONS_SETUP_PYTHON_SHA: a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
  ACTIONS_SETUP_NODE_SHA: 49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
  # github/copilot-cli v1.0.60 linux x64 release asset (verified in CI before extract).
  COPILOT_CLI_VERSION: "1.0.60"
  COPILOT_CLI_TARBALL_SHA256: bcbc762b86b3997586883a92995ee0cc1ae35fb80c1f62250b7eb15f02b1bcc3

jobs:
  # Public akasper/plate: no self-hosted runners (#1284). Skipping select-runs-on removes an
  # extra hosted job (checkout + probe) before test starts; adopters keep plate-select-runs-on
  # in the template payload for private repos and PLATE_RUNS_ON.
  test:
    runs-on: ${{ (github.event.repository.private != true || (github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || ((startsWith((vars.CI_RUNS_ON || vars.PLATE_RUNS_ON), '[') || startsWith((vars.CI_RUNS_ON || vars.PLATE_RUNS_ON), '"')) && (fromJSON((vars.CI_RUNS_ON || vars.PLATE_RUNS_ON)) || 'ubuntu-latest')) || (vars.CI_RUNS_ON || vars.PLATE_RUNS_ON) || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Node / Playwright / process-docs are exercised once (3.12) to limit CI cost.
          - python-version: "3.12"
            with_node: true
    steps:
      - uses: actions/checkout@${{ env.ACTIONS_CHECKOUT_SHA }}

      - name: Set up Python
        uses: actions/setup-python@${{ env.ACTIONS_SETUP_PYTHON_SHA }}
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools and ruff
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet build ruff pyyaml wheel

      - name: Ruff (syntax and critical pyflakes baseline)
        run: python -m ruff check src tests

      - name: Build wheel and install plate-core
        run: |
          set -euo pipefail
          python -m build -w
          python -m pip install --quiet --force-reinstall dist/*.whl

      - name: Run unit tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_*.py"

      - name: Plugin skill surface sync check (SKILLS.md + SKILL.md)
        run: python3 scripts/generate-plugin-skills.py --check

      - name: Plugin agent surface sync check (AGENTS.md + .agent.md)
        run: python3 scripts/generate-plugin-agents.py --check

      - name: Grok marketplace packaging check (generator + committed index)
        run: |
          set -euo pipefail
          python3 scripts/generate-grok-plugin-index.py --check

      - name: Set up Node.js
        if: matrix.with_node == true
        uses: actions/setup-node@${{ env.ACTIONS_SETUP_NODE_SHA }}
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            tests/e2e/package-lock.json
            services/process-docs/package-lock.json

      - name: Process docs service (unit tests + link check)
        if: matrix.with_node == true
        run: |
          set -euo pipefail
          cd services/process-docs
          npm ci
          npm run bundle
          npm test
          npm run check:links

      - name: Install Playwright and dependencies
        if: matrix.with_node == true
        working-directory: tests/e2e
        run: npm ci

      - name: Run Playwright e2e tests
        if: matrix.with_node == true
        working-directory: tests/e2e
        run: npx playwright test
        env:
          WORKSPACE: ${{ github.workspace }}

  # Optional network smoke (#1478 T3): not listed in branch protection required checks.
  copilot-marketplace-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@${{ env.ACTIONS_CHECKOUT_SHA }}

      - name: Install Copilot CLI (checksum-verified)
        run: |
          set -euo pipefail
          COPILOT_VERSION="${{ env.COPILOT_CLI_VERSION }}"
          EXPECTED_SHA="${{ env.COPILOT_CLI_TARBALL_SHA256 }}"
          curl -fsSL -o copilot-linux-x64.tar.gz \
            "https://github.com/github/copilot-cli/releases/download/v${COPILOT_VERSION}/copilot-linux-x64.tar.gz"
          ACTUAL_SHA="$(sha256sum copilot-linux-x64.tar.gz | awk '{print $1}')"
          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Copilot CLI tarball SHA256 mismatch (expected ${EXPECTED_SHA}, got ${ACTUAL_SHA})"
            exit 1
          fi
          tar -xzf copilot-linux-x64.tar.gz
          chmod +x copilot
          sudo mv copilot /usr/local/bin/copilot
          copilot --version

      - name: Plugin install smoke test (pre-launch marketplace surface)
        run: |
          set -euo pipefail
          copilot plugin marketplace add akasper/plate
          copilot plugin install plate-core@plate-marketplace
          copilot plugin uninstall plate-core
          copilot plugin marketplace remove plate-marketplace --force

  # Release ceremony refinement: differentiated heavy CI for Release PRs / stabilization contexts.
  # These jobs run *after* the lightweight gates (the test job above acts as a common fast-fail).
  # They activate for release packaging/stabilization PRs targeting the legacy 'release' branch
  # or release-* / release-v* branches (multi-track or versioned cuts).
  # The 'Release' label (in addition to 'Documentation' PR type) is required on Release PRs
  # (and for legacy 'release' head_ref) to prevent skips in these jobs (see #532).
  # For review/stabilization pushes (small feedback fixes, thread resolves, docs/metadata on a
  # release-v* PR): use label 'stabilization' (or rely on non-code changes) to keep CI cost low.
  # Add expensive steps here: expanded e2e matrix, security scans, architecture review, packaging...
  # Normal development to the permissive next-* branches stays on the lightweight path.
  # Addresses #569 stabilization CI path.
  heavy-release:
    needs:
      - test
    if: |
      github.head_ref == 'release' ||
      startsWith(github.head_ref, 'release-') ||
      startsWith(github.base_ref, 'release-')
    runs-on: ${{ (github.event.repository.private != true || (github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || ((startsWith((vars.CI_RUNS_ON || vars.PLATE_RUNS_ON), '[') || startsWith((vars.CI_RUNS_ON || vars.PLATE_RUNS_ON), '"')) && (fromJSON((vars.CI_RUNS_ON || vars.PLATE_RUNS_ON)) || 'ubuntu-latest')) || (vars.CI_RUNS_ON || vars.PLATE_RUNS_ON) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@${{ env.ACTIONS_CHECKOUT_SHA }}

      - name: Heavy release context detected
        run: |
          echo "This PR is in release packaging/stabilization context via release-*/release-v* branches."
          echo "Run expensive steps here (full builds, security, extra e2e, architecture review, packaging...)."
          echo "Remember common gateway fast-fails earlier in the job or previous jobs."

      - name: Skip full heavy for stabilization/review responses (if labeled)
        if: contains(github.event.pull_request.labels.*.name, 'stabilization') || contains(github.event.pull_request.labels.*.name, 'Documentation')
        run: |
          echo "Stabilization or Documentation-only push on release context: skipping expensive steps to reduce CI waste (#569)."

      - name: Set up Python
        if: ${{ ! (contains(github.event.pull_request.labels.*.name, 'stabilization') || contains(github.event.pull_request.labels.*.name, 'Documentation')) }}
        uses: actions/setup-python@${{ env.ACTIONS_SETUP_PYTHON_SHA }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build sdist and wheel; install and import smoke
        if: ${{ ! (contains(github.event.pull_request.labels.*.name, 'stabilization') || contains(github.event.pull_request.labels.*.name, 'Documentation')) }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip build
          python -m build
          ls -la dist/
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -c 'import plate_core, sys; print("plate_core", plate_core.__version__, "python", sys.version.split()[0])'