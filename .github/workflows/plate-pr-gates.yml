name: PLATE PR Gates

# Required status check context: pr-gates (this job id).
# Replaces separate workflows: pr-title-check, pr-issue-link-check,
# pr-documentation-check, feedback-resolution-check, audit, and ci validate-release-pr.

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - milestoned
      - demilestoned
      - ready_for_review
      - closed
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  push:
    branches: [release, 'release-*', 'release-v*']

concurrency:
  # Non-gating label events use an isolated group and must not cancel real gate runs (#1228).
  group: plate-pr-gates-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && contains(fromJSON('["labeled","unlabeled"]'), github.event.action) && !contains(fromJSON('["Feature","Bug","Documentation","Feedback Response","no-issue","Release"]'), github.event.label.name) && 'label-noop' || 'gate' }}
  cancel-in-progress: ${{ !(github.event_name == 'pull_request' && contains(fromJSON('["labeled","unlabeled"]'), github.event.action) && !contains(fromJSON('["Feature","Bug","Documentation","Feedback Response","no-issue","Release"]'), github.event.label.name)) }}

permissions:
  contents: read
  issues: read
  pull-requests: write
  actions: read

jobs:
  pr-gates:
    name: pr-gates
    if: |
      github.event_name == 'pull_request_review' ||
      github.event_name == 'pull_request_review_comment' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select runs-on for heavy jobs
        id: plate_runs_on
        uses: ./.github/actions/plate-select-runs-on
        with:
          plate-runs-on: ${{ vars.PLATE_RUNS_ON }}

      - name: Gate — PR title
        if: |
          github.event_name == 'pull_request' &&
          contains(fromJSON('["opened","edited","synchronize","reopened","labeled","unlabeled","milestoned","demilestoned","ready_for_review"]'), github.event.action)
        uses: actions/github-script@v8
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const title = (pullRequest?.title || '').trim();
            
            if (!pullRequest) {
              core.info('No pull request payload found.');
              return;
            }
            
            // Bracketed label-style prefixes are disallowed in PR titles.
            const hasBracketPrefix = /^\[[^\]]+\]/.test(title);
            
            // Legacy non-bracket prefixes are also disallowed (use draft state instead).
            const hasLegacyPrefix = /^(WIP|DRAFT)\s*:/i.test(title);
            
            // Closing keywords belong in the PR body or Development sidebar link, not title.
            const hasClosingKeyword = /\b(closes?|closed|fixe?s?|fixed|resolve[sd]?)\s+(#\d+|https?:\/\/github\.com\/[^\s]+\/issues\/\d+)/i.test(title);
            
            if (!hasBracketPrefix && !hasLegacyPrefix && !hasClosingKeyword) {
              core.info('PR title format is valid.');
              return;
            }
            
            const failures = [];
            if (hasBracketPrefix) failures.push('- Remove bracketed prefixes (for example `[Feature]`, `[Bug]`, `[Documentation]`).');
            if (hasLegacyPrefix) failures.push('- Remove legacy prefixes like `WIP:` or `DRAFT:`; use native Draft PR status instead.');
            if (hasClosingKeyword) failures.push('- Remove closing keywords from the title; put `Closes #N` / `Fixes #N` / `Resolves #N` in the PR body.');
            
            core.setFailed(
              [
                '## ⚠️ Invalid PR title format',
                '',
                'PR titles must be human-readable summaries only.',
                '',
                ...failures,
                '',
                `Current title: \`${title}\``,
              ].join('\n')
            );


      - name: Gate — issue links
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const rawBody = pullRequest?.body || '';
            const labels = (pullRequest?.labels || []).map((l) => l.name);
            
            function stripClosingScanText(markdown) {
              let text = markdown || '';
              text = text.replace(/<!--[\s\S]*?-->/g, '');
              text = text.replace(/```[^\n]*\n[\s\S]*?```/g, '');
              return text;
            }
            
            const closingPatternForScan =
              /\b(closes?|closed|fixe?s?|fixed|resolve[sd]?)\s+(?:https?:\/\/github\.com\/[^\s]+\/issues\/\d+|#\d+)\b/i;
            
            if (!pullRequest) {
              core.info('No pull request payload found.');
              return;
            }
            
            // PRs explicitly labeled no-issue are exempt (dependency bumps, hotfixes, etc.)
            if (labels.includes('no-issue') || labels.includes('Feedback Response')) {
              core.info('PR is exempt from linked issue enforcement.');
              return;
            }
            
            const body = stripClosingScanText(rawBody);
            const hasClosingKeyword = closingPatternForScan.test(body);
            const requiresIssue = labels.some((l) => ['Feature', 'Bug', 'Documentation'].includes(l));
            
            if (!requiresIssue) {
              core.info('PR type does not require linked issue enforcement.');
              return;
            }
            
            if (!pullRequest.milestone) {
              core.warning(
                `Warning-only rollout: this ${labels.filter((l) => ['Feature', 'Bug', 'Documentation'].includes(l)).join('/')} PR has no milestone. ` +
                `Add one with: gh pr edit ${pullRequest.number} --milestone \"<milestone title>\"`
              );
            } else {
              core.info(`PR milestone present: ${pullRequest.milestone.title}`);
            }
            
            async function replaySidebarLinkedIssues() {
              const linked = new Set();
              let after = null;
              const events = [];
              for (;;) {
                let page;
                try {
                  const result = await github.graphql(
                    `
                      query($owner: String!, $repo: String!, $number: Int!, $after: String) {
                        repository(owner: $owner, name: $repo) {
                          pullRequest(number: $number) {
                            timelineItems(first: 100, after: $after, itemTypes: [CONNECTED_EVENT, DISCONNECTED_EVENT]) {
                              pageInfo { hasNextPage endCursor }
                              nodes {
                                __typename
                                ... on ConnectedEvent {
                                  createdAt
                                  subject {
                                    __typename
                                    ... on Issue { number }
                                  }
                                }
                                ... on DisconnectedEvent {
                                  createdAt
                                  subject {
                                    __typename
                                    ... on Issue { number }
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                    `,
                    {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      number: pullRequest.number,
                      after,
                    }
                  );
                  page = result.repository.pullRequest.timelineItems;
                } catch (error) {
                  core.setFailed(
                    `Unable to verify linked issues from the GitHub API (${error.message}). Check repository permissions or GitHub API status, then re-run this check.`
                  );
                  return null;
                }
                events.push(...(page.nodes || []));
                if (!page.pageInfo.hasNextPage) {
                  break;
                }
                after = page.pageInfo.endCursor;
              }
              events.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
              for (const node of events) {
                if (node.subject?.__typename !== 'Issue') {
                  continue;
                }
                const num = node.subject.number;
                if (node.__typename === 'ConnectedEvent') {
                  linked.add(num);
                } else if (node.__typename === 'DisconnectedEvent') {
                  linked.delete(num);
                }
              }
              return linked;
            }
            
            const sidebarLinked = await replaySidebarLinkedIssues();
            if (sidebarLinked === null) {
              return;
            }
            
            const bodyLinked = new Set();
            const bodyParseRe =
              /\b(closes?|closed|fixe?s?|fixed|resolve[sd]?)\s+(?:https?:\/\/github\.com\/([^/\s]+)\/([^/\s]+)\/issues\/(\d+)|#(\d+))\b/gi;
            const repoOwner = context.repo.owner.toLowerCase();
            const repoName = context.repo.repo.toLowerCase();
            let m;
            while ((m = bodyParseRe.exec(body)) !== null) {
              const urlOwner = m[2];
              const urlRepo = m[3];
              const issueNum = parseInt(m[4] || m[5], 10);
              if (urlOwner && urlRepo) {
                if (urlOwner.toLowerCase() !== repoOwner || urlRepo.toLowerCase() !== repoName) {
                  continue;
                }
              }
              bodyLinked.add(issueNum);
            }
            
            const linkedIssueNumbers = new Set([...sidebarLinked, ...bodyLinked]);
            
            if (hasClosingKeyword || linkedIssueNumbers.size > 0) {
              if (linkedIssueNumbers.size > 0) {
                core.info(`Development sidebar or closing-reference issues found: ${Array.from(linkedIssueNumbers).join(', ')}`);
              }
              core.info('Issue link requirement satisfied.');
              return;
            }
            
            const message = [
              '## ⚠️ No linked issue detected',
              '',
              'PLATE requires `Feature`, `Bug`, and issue-driven `Documentation` PRs to link at least one tracked issue.',
              '',
              'Accepted link methods:',
              '- `Closes #N` / `Fixes #N` / `Resolves #N` in the PR body when merge should close the issue',
              '- A GitHub Development sidebar link when the issue should stay open after the PR lands',
              '',
              '**This PR is labeled `Feature`, `Bug`, or `Documentation` and must link at least one issue.**',
              'Use `no-issue` only for true chores, maintenance, or other PRs that intentionally do not resolve tracked work.',
            ].join('\n');
            
            core.setFailed(message);


      - name: Gate — Feature release fragment (labels)
        if: github.event_name == 'pull_request'
        id: feature_labels
        uses: actions/github-script@v8
        with:
          script: |
            const labels = (context.payload.pull_request?.labels || []).map((l) => l.name);
            const isFeature = labels.includes('Feature');
            core.setOutput('is_feature', String(isFeature));
            core.info(`Feature PR: ${isFeature}`);

      - name: Gate — Feature release fragment
        if: |
          github.event_name == 'pull_request' && steps.feature_labels.outputs.is_feature == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const changed = files
              .filter((file) => file.status !== 'removed')
              .map((file) => file.filename);
            core.info(`Changed files:\n${changed.join('\n')}`);
            // Fragment-first: require a fragment in .agentic/releases/unreleased/
            const hasFragment = changed.some(
              (file) =>
                file.startsWith('.agentic/releases/unreleased/') &&
                file.endsWith('.json')
            );
            // Also accept legacy flat files for backward compat
            const hasLegacyFile = changed.some(
              (file) =>
                file.startsWith('.agentic/releases/') &&
                !file.startsWith('.agentic/releases/unreleased/') &&
                file.endsWith('.json')
            );
            const hasReleaseChangeFile = hasFragment || hasLegacyFile;
            if (!hasReleaseChangeFile) {
              core.setFailed(
                'Feature pull requests must include per-feature change files (a release fragment) in .agentic/releases/unreleased/<slug>.json. ' +
                'See .agentic/releases/unreleased/README.md for the required schema. ' +
                'If this PR is not a Feature, remove the Feature label.'
              );
            }


      - name: Gate — Feature release fragment (skip notice)
        if: |
          github.event_name == 'pull_request' && steps.feature_labels.outputs.is_feature != 'true'
        run: echo "Not a Feature PR; release fragment in .agentic/releases/unreleased/ is not required by this check."

      - name: Gate — feedback resolution
        if: |
          github.event_name == 'pull_request_review' ||
          github.event_name == 'pull_request_review_comment' ||
          (github.event_name == 'pull_request' && contains(fromJSON('["opened","reopened","synchronize","ready_for_review","labeled","unlabeled","milestoned","demilestoned","edited"]'), github.event.action))
        uses: actions/github-script@v8
        env:
          PLATE_PR_FEEDBACK_AGENTS: ${{ vars.PLATE_PR_FEEDBACK_AGENTS }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request?.number;
            
            if (!prNumber) {
              core.info('No pull_request payload found; skipping.');
              return;
            }
            
            const unresolved = [];
            let reviewDecision = null;
            let cursor = null;
            const customAgentsEnv = process.env.PLATE_PR_FEEDBACK_AGENTS || '';
            const customAgents = customAgentsEnv.split(',').map(s => s.trim()).filter(Boolean);
            let agentPatterns;
            if (customAgents.length > 0) {
              agentPatterns = customAgents.map(c => new RegExp('^' + c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'));
            } else {
              agentPatterns = [/^devin/i, /^openhands/i, /^codegen/i, /^swe-agent/i, /^aide-agent/i, /^mentat-bot/i];
            }
            
            try {
              do {
                const result = await github.graphql(
                  `query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        reviewDecision
                        reviewThreads(first: 100, after: $cursor) {
                          nodes {
                            isResolved
                            isOutdated
                            comments(first: 1) {
                              nodes {
                                author {
                                  login
                                }
                              }
                            }
                          }
                          pageInfo {
                            hasNextPage
                            endCursor
                          }
                        }
                      }
                    }
                  }`,
                  {
                    owner,
                    repo,
                    number: prNumber,
                    cursor,
                  }
                );
            
                const pr = result.repository?.pullRequest;
                if (!pr) {
                  core.info('No PR data from GraphQL; skipping gate evaluation this run.');
                  return;
                }
                reviewDecision = pr.reviewDecision;
            
                for (const thread of pr.reviewThreads.nodes) {
                  if (!thread.isResolved && !thread.isOutdated) {
                    const author = thread.comments.nodes[0]?.author?.login || 'unknown';
                    unresolved.push(author);
                  }
                }
            
                const pageInfo = pr.reviewThreads.pageInfo;
                cursor = pageInfo.hasNextPage ? pageInfo.endCursor : null;
              } while (cursor);
            
              const actionableUnresolved = unresolved.filter((author) =>
                agentPatterns.some((p) => p.test(author))
              );
            
              if (reviewDecision === 'CHANGES_REQUESTED') {
                core.setFailed(
                  'PR reviewDecision is CHANGES_REQUESTED. Address feedback and re-request review before merge.'
                );
                return;
              }
            
              if (actionableUnresolved.length > 0) {
                const sample = actionableUnresolved.slice(0, 8).join(', ');
                core.setFailed(
                  `Found ${actionableUnresolved.length} unresolved active review thread(s) from third-party agents. Resolve agent threads (or use need:human-review for human judgment items) before merge. Authors: ${sample}`
                );
                return;
              }
            
              core.info('All active review threads are resolved and no CHANGES_REQUESTED decision remains.');
            } catch (err) {
              // Resilience fix: transient GraphQL/payload errors or script issues should not hard-fail the gate.
              // Only explicit unresolved/CHANGES_REQUESTED conditions set failure. Log and succeed otherwise
              // so a fresh synchronize run can pass when state is clean (0 unresolved threads).
              core.info(`Non-fatal error during feedback-resolution gate evaluation (will not block on transient): ${err.message || err}`);
            }


      - name: Gate — audit checkout
        if: |
          github.event_name == 'pull_request' &&
          contains(fromJSON('["opened","synchronize","reopened","edited","labeled","unlabeled","milestoned","demilestoned","ready_for_review"]'), github.event.action)
        run: echo "Audit workflow context loaded (checkout complete)."

      - name: Gate — validate release PR
        if: |
          github.event_name == 'pull_request' && (
            contains(github.event.pull_request.labels.*.name, 'Release') ||
            github.head_ref == 'release' ||
            startsWith(github.head_ref, 'release-v')
          )
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          from plate_core.release import validate_release_workspace

          report = validate_release_workspace(Path(os.environ["GITHUB_WORKSPACE"]))
          print(json.dumps(report.to_dict(), indent=2))
          if report.errors:
              print("\n".join(report.errors), file=sys.stderr)
              raise SystemExit(1)
          PY
          RELEASE_TAG="$(python - <<'PY'
          import os
          from pathlib import Path
          from plate_core.release import validate_release_workspace
          report = validate_release_workspace(Path(os.environ["GITHUB_WORKSPACE"]))
          print(report.release_tag)
          PY
          )"
          if git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | grep -q .; then
            echo "Release tag ${RELEASE_TAG} already exists on origin."
            exit 1
          fi


  mark-implemented-on-release-merge:
    if: |
      (github.event_name == 'pull_request' &&
       github.event.action == 'closed' &&
       github.event.pull_request.merged == true &&
       (startsWith(github.event.pull_request.base.ref, 'release') ||
        github.event.pull_request.base.ref == 'release' ||
        startsWith(github.event.pull_request.base.ref, 'epic/'))) ||
      (github.event_name == 'push' &&
       (startsWith(github.ref, 'refs/heads/release') || startsWith(github.ref, 'refs/heads/epic/')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Mark implemented + auto-close linked issues (integration merge)
        uses: actions/github-script@v8
        with:
          script: |
            const isPR = !!context.payload.pull_request;
            const pr = context.payload.pull_request;
            const baseRef = isPR ? pr.base.ref : (context.ref || '').replace('refs/heads/', '');
            const isIntegration =
              !!baseRef &&
              (baseRef === 'release' ||
                baseRef.startsWith('release-') ||
                baseRef.startsWith('release/') ||
                baseRef.startsWith('epic/') ||
                baseRef.startsWith('epic-'));
            if (!isIntegration || baseRef === 'main') {
              core.info(`Not a PLATE integration merge (base=${baseRef}); skipping.`);
              return;
            }
            
            function stripClosingScanText(markdown) {
              let text = markdown || '';
              text = text.replace(/<!--[\s\S]*?-->/g, '');
              text = text.replace(/```[^\n]*\n[\s\S]*?```/g, '');
              return text;
            }
            
            // Parse Closes/Fixes/Resolves (body only; title must not carry keywords)
            const linked = new Set();
            if (isPR) {
              const body = stripClosingScanText(pr.body || '');
              const closingPattern =
                /\b(closes?|closed|fixe?s?|fixed|resolve[sd]?)\s+(?:https?:\/\/github\.com\/([^/\s]+)\/([^/\s]+)\/issues\/(\d+)|#(\d+))\b/gi;
              const repoOwner = context.repo.owner.toLowerCase();
              const repoName = context.repo.repo.toLowerCase();
              let m;
              while ((m = closingPattern.exec(body)) !== null) {
                const urlOwner = m[2];
                const urlRepo = m[3];
                const issueNum = parseInt(m[4] || m[5], 10);
                if (urlOwner && urlRepo) {
                  if (
                    urlOwner.toLowerCase() !== repoOwner ||
                    urlRepo.toLowerCase() !== repoName
                  ) {
                    core.info(
                      `Skipping #${issueNum} from ${urlOwner}/${urlRepo} (not ${context.repo.owner}/${context.repo.repo}).`
                    );
                    continue;
                  }
                }
                linked.add(issueNum);
              }
            }
            if (linked.size === 0) {
              core.info('No linked issues via closing keywords; nothing to label/close.');
              return;
            }
            
            const SKIP_CLOSE = new Set(['Epic', 'Task', 'Release']);
            const label = 'status:implemented';
            const prNumber = isPR ? pr.number : 0;
            const closed = [];
            const labeled = [];
            const skipped = [];
            
            for (const num of linked) {
              let issue;
              try {
                const resp = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                });
                issue = resp.data;
              } catch (e) {
                core.warning(`Could not fetch #${num}: ${e.message}`);
                continue;
              }
            
              // Always attempt status:implemented on open issues
              if (issue.state === 'open') {
                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: num,
                    labels: [label],
                  });
                  labeled.push(num);
                  core.info(`Added ${label} to #${num} (merged to ${baseRef}).`);
                } catch (e) {
                  core.warning(`Failed to label #${num}: ${e.message}`);
                }
              } else {
                core.info(`#${num} already ${issue.state}; skip label/close.`);
                skipped.push({ number: num, reason: `already_${issue.state}` });
                continue;
              }
            
              const names = (issue.labels || []).map((l) =>
                typeof l === 'string' ? l : l.name
              );
              const skipHit = names.filter((n) => SKIP_CLOSE.has(n));
              if (skipHit.length) {
                core.info(`Skip auto-close #${num}: types ${skipHit.join(',')}`);
                skipped.push({ number: num, reason: `skip_type:${skipHit.join(',')}` });
                continue;
              }
            
              const commentBody = [
                `Auto-closed after merge of #${prNumber} into \`${baseRef}\` (PLATE integration-branch close, #427).`,
                '',
                '<!-- PLATE-INTEGRATION-CLOSE:BEGIN -->',
                JSON.stringify({ pr: prNumber, base: baseRef, reason: 'closing_keyword' }),
                '<!-- PLATE-INTEGRATION-CLOSE:END -->',
                '',
              ].join('\n');
            
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                  body: commentBody,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                  state: 'closed',
                  state_reason: 'completed',
                });
                closed.push(num);
                core.info(`Closed #${num} after merge to ${baseRef}.`);
              } catch (e) {
                core.warning(`Failed to close #${num}: ${e.message}`);
              }
            }
            
            core.info(
              `Integration close audit: labeled=[${labeled.join(',')}] closed=[${closed.join(',')}] skipped=${JSON.stringify(skipped)}`
            );

