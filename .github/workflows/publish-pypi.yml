name: Publish plate-core to PyPI (PLATE-CORE-PUBLISHING-ONLY)

# PLATE-CORE-PUBLISHING-ONLY
# ============================================================
# This workflow publishes the `plate-core` Python package (sdist + wheel)
# to PyPI whenever a release is cut (v* tag produced by the normal PLATE
# release ceremony in release.yml + tag creation job).
#
# It complements publish-gh-plate-extension.yml (the thin gh- shim for the
# `gh plate` extension).
#
# THIS IS SPECIFIC INFRASTRUCTURE FOR PUBLISHING THE OFFICIAL
# plate_core / akasper/plate PyPI package surface.
#
# IT IS NOT PART OF THE PLATE METHODOLOGY.
# IT IS NOT PART OF AGENTS.md, THE GENERAL RELEASE CEREMONY,
# OR ANYTHING DOWNSTREAM PLATE ADOPTERS SHOULD COPY OR CARE ABOUT.
#
# Do not sync this file (or the logic it contains) into
# src/plate_core/template_payload/.github/workflows/
# or treat it as reusable PLATE process or template content.
#
# The thin repo (akasper/gh-plate) is a minimal shim whose only job
# is to host the launcher script. All real code, the plate-core PyPI
# package, MCP, plugins, etc. live in the main akasper/plate repo.
# ============================================================

on:
  # Trigger after the normal release ceremony has produced a tag on main.
  # Same trigger as the gh-plate thin-shim publisher.
  push:
    tags:
      - 'v*'
  # Also allow manual trigger for recovery / initial seed / back-publishing
  # a prior release (e.g. publish 0.7.2 after this change lands so that
  # gh-plate v0.7.2 pins stop failing).
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag, branch or SHA) to checkout and build from. Defaults to the triggering ref/tag.'
        required: false
        default: ''

permissions:
  contents: read
  # Required for trusted publishing via GitHub OIDC (no PYPI_TOKEN secret).
  id-token: write

jobs:
  publish:
    # Only run on the real main repo, not forks.
    if: github.repository == 'akasper/plate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo at the release ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Python (>= 3.10 as declared in pyproject)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build
        # Artifacts land in dist/

      - name: Verify built artifacts (import + version smoke)
        run: |
          set -euo pipefail
          ls -l dist/
          # Install the wheel without deps (plate-core has none) to smoke the package
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -c '
          import plate_core
          import sys
          print("Successfully imported plate_core version:", plate_core.__version__)
          print("Python:", sys.version)
          '
          # Best-effort twine metadata check (non-fatal if twine complains about
          # dev metadata on a real release tag)
          python -m twine check dist/* || echo "twine check produced warnings (non-fatal)"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted publishing: the workflow's OIDC token is exchanged for a
        # short-lived PyPI token automatically. The plate-core project on
        # PyPI must have akasper/plate + this workflow filename registered
        # under Settings > Publishing > Trusted publishers (one-time owner step).
        # See https://docs.pypi.org/trusted-publishers/ for setup.
        #
        # On first use after this PR, use workflow_dispatch with ref=v0.7.2
        # (and any earlier tags) to backfill so the version pins in gh-plate
        # shims become satisfiable.

      - name: Summary
        run: |
          echo "plate-core published to PyPI for ${{ github.ref_name || github.event.inputs.ref }}"
          echo "Users can now: pip install plate-core"
          echo "The gh-plate extension shim (version-locked installs) will now succeed."
          echo "See Bug #623."
