name: Release
on:
  push:
    branches: [main]
  pull_request:
    types: [closed]

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag-release-merge:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      (
        contains(github.event.pull_request.labels.*.name, 'Release') ||
        github.event.pull_request.head.ref == 'release' ||
        startsWith(github.event.pull_request.head.ref, 'release-v')
      )
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release-version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Warn when Release PR merge may break release-branch fast-forward (#1455)
        continue-on-error: true
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set +e
          merge_sha="${MERGE_SHA}"
          if [ -z "${merge_sha}" ]; then
            echo "MERGE_SHA missing; skipping merge-method advisory."
            exit 0
          fi
          parent_count=0
          if parent_line="$(git rev-list --parents -n 1 "${merge_sha}" 2>/dev/null)"; then
            parent_count=$(( $(wc -w <<< "${parent_line}") - 1 ))
          fi
          subject="$(git log -1 --format=%s "${merge_sha}" 2>/dev/null || true)"
          if [ "${parent_count}" -ge 2 ] || echo "${subject}" | grep -Eq '^Merge pull request'; then
            echo "Release merge commit parent_count=${parent_count}; merge-commit shape looks OK for release-branch fast-forward."
            exit 0
          fi
          echo "::warning::Release PR merge commit has parent_count=${parent_count} and does not look like a merge commit (${subject}). If this Release PR was squash- or rebase-merged, standing release branches cannot fast-forward to the tag without admin repair (#1455). Merge Release PRs with Create a merge commit (or fast-forward), not squash/rebase."
          exit 0

      - name: Resolve release version
        id: release-version
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          from plate_core.release import validate_release_workspace

          report = validate_release_workspace(Path(os.environ["GITHUB_WORKSPACE"]))
          print(json.dumps(report.to_dict(), indent=2))
          if report.errors:
              print("\n".join(report.errors), file=sys.stderr)
              raise SystemExit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"release_tag={report.release_tag}\n")
          PY

      - name: Create or verify release tag
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_TAG: ${{ steps.release-version.outputs.release_tag }}
        run: |
          set -euo pipefail
          existing_sha="$(
            git ls-remote --tags origin "refs/tags/${RELEASE_TAG}^{}" | awk '{print $1}' | head -n1
          )"
          if [ -z "${existing_sha}" ]; then
            existing_sha="$(
              git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}' | head -n1
            )"
          fi

          if [ -z "${existing_sha}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${RELEASE_TAG}" "${MERGE_SHA}"
            git push origin "refs/tags/${RELEASE_TAG}"
            echo "Created ${RELEASE_TAG} at ${MERGE_SHA}."
            exit 0
          fi

          if [ "${existing_sha}" = "${MERGE_SHA}" ]; then
            echo "${RELEASE_TAG} already exists on ${MERGE_SHA}; nothing to do."
            exit 0
          fi

          echo "${RELEASE_TAG} already exists on ${existing_sha}, not ${MERGE_SHA}."
          exit 1

      - name: Create GitHub Release (best-effort happy path for Releases tab / latest / notes)
        # Per #593 (child of #591): after tag step, create the release object using the shared
        # helper from #592. Best-effort/non-blocking so tag creation (the authoritative step)
        # cannot be impacted. Reuses create_github_release + rendering + assets logic (DRY).
        # Same v{ver}/assets/ convention. Idempotent. See refined ACs in #593.
        env:
          RELEASE_TAG: ${{ steps.release-version.outputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e  # best-effort: continue even if this fails (tag is critical)
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          # Cheap sanity check before the heredoc (per review feedback on set +e scope).
          # In a controlled runner this is unlikely to be the failure mode, but makes
          # early problems visible rather than silent under set +e.
          python --version >&2 || echo "WARNING: python --version sanity check failed (best-effort block continues)"
          python - <<'PY'
          import os
          from pathlib import Path
          from plate_core.release import create_github_release

          tag = os.environ.get("RELEASE_TAG", "")
          ver = tag.lstrip("v") if tag else ""
          if not ver:
              print("WARNING: No RELEASE_TAG; skipping GitHub Release creation")
              exit(0)
          try:
              info = create_github_release(
                  version=ver,
                  releases_dir=Path(".agentic/releases"),
                  # repo=None -> resolves from git remote (the checkout is at the merge sha)
              )
              print(f"GitHub Release created/verified: {info}")
          except Exception as exc:
              print(f"WARNING: GitHub Release creation failed (best-effort, non-blocking): {exc}")
              print("The git tag is reliable. Use 'gh plate release finalize <ver>' for repair if needed.")
          PY

      # GitHub Release object creation (happy path for the UI tab / latest badge / notes).
      # See Epic #591 + children #592 (explicit finalize path + shared helper) and #593 (this step).
      # Best-effort / non-blocking per refinement: tag creation is the critical path.
      # Reuses create_github_release + _render_release_notes from plate_core.release (DRY with CLI).
      # Same simple assets convention (v{ver}/assets/ if present in the checked-out artifact).
      # Added in #593; idempotent via the helper; graceful on 404/exists/rate/etc.
      # (The explicit `gh plate release finalize` path remains available for repair/manual runs.)

  fast-forward-release-branches:
    needs: tag-release-merge
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      (
        contains(github.event.pull_request.labels.*.name, 'Release') ||
        github.event.pull_request.head.ref == 'release' ||
        startsWith(github.event.pull_request.head.ref, 'release-v')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      # Map secrets here so step `if:` can use `env.*` (secrets.* is not allowed in step if expressions).
      PLATE_FF_APP_ID: ${{ secrets.PLATE_APP_ID }}
      PLATE_FF_APP_PRIVATE_KEY: ${{ secrets.PLATE_APP_PRIVATE_KEY }}
    steps:
      - name: Warn when lifecycle App secrets are missing (fast-forward push skipped)
        if: ${{ env.PLATE_FF_APP_ID == '' || env.PLATE_FF_APP_PRIVATE_KEY == '' }}
        run: |
          echo '::warning::Release-branch fast-forward was skipped because repository secrets PLATE_APP_ID and PLATE_APP_PRIVATE_KEY are not both configured. On user-owned repositories, branch rulesets often block github-actions from pushing standing release-track branches; configure a GitHub App with Contents (read/write) plus Issues and Pull requests (read/write), install it on this repo, add those secrets, and register the App as an Always-allow bypass actor on the release-branch ruleset (or run a manual admin fast-forward). Organization repositories may instead grant github-actions bypass where policy allows.'

      - uses: actions/create-github-app-token@v1
        id: plate-app-token
        if: ${{ env.PLATE_FF_APP_ID != '' && env.PLATE_FF_APP_PRIVATE_KEY != '' }}
        with:
          app-id: ${{ secrets.PLATE_APP_ID }}
          private-key: ${{ secrets.PLATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}

      - uses: actions/checkout@v4
        if: ${{ env.PLATE_FF_APP_ID != '' && env.PLATE_FF_APP_PRIVATE_KEY != '' }}
        with:
          fetch-depth: 0
          token: ${{ steps.plate-app-token.outputs.token || github.token }}

      - name: Fast-forward release branches to tag (no force push)
        if: ${{ env.PLATE_FF_APP_ID != '' && env.PLATE_FF_APP_PRIVATE_KEY != '' }}
        env:
          RELEASE_TAG: ${{ needs.tag-release-merge.outputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python - <<'PY'
          import json
          import os
          import sys
          from plate_core.release import (
              fast_forward_release_branches,
              format_fast_forward_failure_comment,
              post_release_fast_forward_comment,
          )

          tag = os.environ.get("RELEASE_TAG", "").strip()
          if not tag:
              print("RELEASE_TAG missing; cannot fast-forward release branches.", file=sys.stderr)
              raise SystemExit(1)

          result = fast_forward_release_branches(tag, apply=True)
          print(json.dumps(result, indent=2))
          if result.get("ok"):
              raise SystemExit(0)

          comment = format_fast_forward_failure_comment(result)
          posted = post_release_fast_forward_comment(comment)
          print(json.dumps({"issue_comment": posted}, indent=2))

          if result.get("bypass_required"):
              print(result.get("bypass_hint", ""), file=sys.stderr)
          if result.get("blocked"):
              blocked = result["blocked"]
              print(
                  f"Fast-forward blocked on {blocked.get('branch')}: branch is not an ancestor of the tag.",
                  file=sys.stderr,
              )
          else:
              print(result.get("error", "fast_forward_failed"), file=sys.stderr)
              if result.get("stderr"):
                  print(result["stderr"], file=sys.stderr)
          raise SystemExit(1)
          PY

  deploy:
    if: github.event_name == 'push'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4