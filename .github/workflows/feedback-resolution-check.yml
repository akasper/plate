name: PR Feedback Resolution Check

# Ensures auto-merge does not complete while actionable PR commentary is still
# open. This check fails when the PR has unresolved review threads *from third-party agents*
# (see PLATE_PR_FEEDBACK_AGENTS and default patterns) or is still in CHANGES_REQUESTED state.
# Human reviews only block via explicit CHANGES_REQUESTED or need:human-review label.
# (Addresses #569 feedback gate author-filter requirement.)

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read

jobs:
  feedback-resolution:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure review feedback is fully resolved
        uses: actions/github-script@v8
        env:
          PLATE_PR_FEEDBACK_AGENTS: ${{ vars.PLATE_PR_FEEDBACK_AGENTS }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request?.number;

            if (!prNumber) {
              core.info('No pull_request payload found; skipping.');
              return;
            }

            const unresolved = [];
            let reviewDecision = null;
            let cursor = null;

            try {
              do {
                const result = await github.graphql(
                  `query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        reviewDecision
                        reviewThreads(first: 100, after: $cursor) {
                          nodes {
                            isResolved
                            isOutdated
                            comments(first: 1) {
                              nodes {
                                author {
                                  login
                                }
                              }
                            }
                          }
                          pageInfo {
                            hasNextPage
                            endCursor
                          }
                        }
                      }
                    }
                  }`,
                  {
                    owner,
                    repo,
                    number: prNumber,
                    cursor,
                  }
                );

                const pr = result.repository?.pullRequest;
                if (!pr) {
                  core.info('No PR data from GraphQL; skipping gate evaluation this run.');
                  return;
                }
                reviewDecision = pr.reviewDecision;

                for (const thread of pr.reviewThreads.nodes) {
                  if (!thread.isResolved && !thread.isOutdated) {
                    const author = thread.comments.nodes[0]?.author?.login || 'unknown';
                    unresolved.push(author);
                  }
                }

                // Author-filter: only treat third-party agent threads as blocking for this gate.
                // Supports PLATE_PR_FEEDBACK_AGENTS repo var (comma-separated custom logins) for
                // downstream customization; falls back to known defaults (matches pr_babysit).
                // Humans use explicit CHANGES_REQUESTED / need:human-review.
                const customAgentsEnv = process.env.PLATE_PR_FEEDBACK_AGENTS || '';
                const customAgents = customAgentsEnv.split(',').map(s => s.trim()).filter(Boolean);
                let agentPatterns;
                if (customAgents.length > 0) {
                  agentPatterns = customAgents.map(c => new RegExp('^' + c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'));
                } else {
                  agentPatterns = [/^devin/i, /^openhands/i, /^codegen/i, /^swe-agent/i, /^aide-agent/i, /^mentat-bot/i];
                }
                const actionableUnresolved = unresolved.filter((author) =>
                  agentPatterns.some((p) => p.test(author))
                );

                const pageInfo = pr.reviewThreads.pageInfo;
                cursor = pageInfo.hasNextPage ? pageInfo.endCursor : null;
              } while (cursor);

              if (reviewDecision === 'CHANGES_REQUESTED') {
                core.setFailed(
                  'PR reviewDecision is CHANGES_REQUESTED. Address feedback and re-request review before merge.'
                );
                return;
              }

              if (actionableUnresolved.length > 0) {
                const sample = actionableUnresolved.slice(0, 8).join(', ');
                core.setFailed(
                  `Found ${actionableUnresolved.length} unresolved active review thread(s) from third-party agents. Resolve agent threads (or use need:human-review for human judgment items) before merge. Authors: ${sample}`
                );
                return;
              }

              core.info('All active review threads are resolved and no CHANGES_REQUESTED decision remains.');
            } catch (err) {
              // Resilience fix: transient GraphQL/payload errors or script issues should not hard-fail the gate.
              // Only explicit unresolved/CHANGES_REQUESTED conditions set failure. Log and succeed otherwise
              // so a fresh synchronize run can pass when state is clean (0 unresolved threads).
              core.info(`Non-fatal error during feedback-resolution gate evaluation (will not block on transient): ${err.message || err}`);
            }
