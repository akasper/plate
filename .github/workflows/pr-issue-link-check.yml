name: PLATE PR Issue Link Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, milestoned, demilestoned, closed]
  push:
    branches: [release, 'release-*', 'release-v*']
    # For post-merge 'implemented' labeling on release track branches (#556)

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  check-issue-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check for linked issue
        uses: actions/github-script@v8
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const body = pullRequest?.body || '';
            const labels = (pullRequest?.labels || []).map((l) => l.name);

            if (!pullRequest) {
              core.info('No pull request payload found.');
              return;
            }

            // PRs explicitly labeled no-issue are exempt (dependency bumps, hotfixes, etc.)
            if (labels.includes('no-issue') || labels.includes('Feedback Response')) {
              core.info('PR is exempt from linked issue enforcement.');
              return;
            }

            // GitHub's native closing keywords (case-insensitive), optionally followed by a URL or #number
            const closingPattern = /\b(closes?|closed|fixe?s?|fixed|resolve[sd]?)\s+(#\d+|https?:\/\/github\.com\/[^\s]+\/issues\/\d+)/i;
            const hasClosingKeyword = closingPattern.test(body);
            const requiresIssue = labels.some((l) => ['Feature', 'Bug', 'Documentation'].includes(l));

            if (!requiresIssue) {
              core.info('PR type does not require linked issue enforcement.');
              return;
            }

            if (!pullRequest.milestone) {
              core.warning(
                `Warning-only rollout: this ${labels.filter((l) => ['Feature', 'Bug', 'Documentation'].includes(l)).join('/')} PR has no milestone. ` +
                `Add one with: gh pr edit ${pullRequest.number} --milestone \"<milestone title>\"`
              );
            } else {
              core.info(`PR milestone present: ${pullRequest.milestone.title}`);
            }

            let data;
            try {
              data = await github.graphql(
                `
                  query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        closingIssuesReferences(first: 20) {
                          nodes {
                            number
                          }
                        }
                        timelineItems(first: 50, itemTypes: [CONNECTED_EVENT]) {
                          nodes {
                            ... on ConnectedEvent {
                              subject {
                                __typename
                                ... on Issue {
                                  number
                                }
                              }
                            }
                          }
                        }
                        disconnectedItems: timelineItems(first: 50, itemTypes: [DISCONNECTED_EVENT]) {
                          nodes {
                            ... on DisconnectedEvent {
                              subject {
                                __typename
                                ... on Issue {
                                  number
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                `,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  number: pullRequest.number,
                }
              );
            } catch (error) {
              core.setFailed(
                `Unable to verify linked issues from the GitHub API (${error.message}). Check repository permissions or GitHub API status, then re-run this check.`
              );
              return;
            }

            const linkedIssueNumbers = new Set(
              (data.repository.pullRequest.closingIssuesReferences?.nodes || []).map((issue) => issue.number)
            );

            for (const node of data.repository.pullRequest.timelineItems?.nodes || []) {
              if (node.subject?.__typename === 'Issue') {
                linkedIssueNumbers.add(node.subject.number);
              }
            }

            // Subtract DISCONNECTED_EVENTs so that sidebar unlinks are correctly detected as unlinked.
            // Re-connects work because a later CONNECTED_EVENT will re-add the number (timeline order is chronological).
            for (const node of data.repository.pullRequest.disconnectedItems?.nodes || []) {
              if (node.subject?.__typename === 'Issue') {
                linkedIssueNumbers.delete(node.subject.number);
              }
            }

            if (hasClosingKeyword || linkedIssueNumbers.size > 0) {
              if (linkedIssueNumbers.size > 0) {
                core.info(`Development sidebar or closing-reference issues found: ${Array.from(linkedIssueNumbers).join(', ')}`);
              }
              core.info('Issue link requirement satisfied.');
              return;
            }

            const message = [
              '## ⚠️ No linked issue detected',
              '',
              'PLATE requires `Feature`, `Bug`, and issue-driven `Documentation` PRs to link at least one tracked issue.',
              '',
              'Accepted link methods:',
              '- `Closes #N` / `Fixes #N` / `Resolves #N` in the PR body when merge should close the issue',
              '- A GitHub Development sidebar link when the issue should stay open after the PR lands',
              '',
              '**This PR is labeled `Feature`, `Bug`, or `Documentation` and must link at least one issue.**',
              'Use `no-issue` only for true chores, maintenance, or other PRs that intentionally do not resolve tracked work.',
            ].join('\n');

            core.setFailed(message);

  # PLATE Issue states (#556) + integration auto-close (#427):
  # On merge to release* or epic/*, mark linked issues status:implemented and close
  # safe issue types (Feature/Bug/Doc/…). Skip Epic/Task/Release (ceremony / human Task).
  # main keeps native GitHub auto-close only.
  mark-implemented-on-release-merge:
    if: |
      (github.event_name == 'pull_request' &&
       github.event.action == 'closed' &&
       github.event.pull_request.merged == true &&
       (startsWith(github.event.pull_request.base.ref, 'release') ||
        github.event.pull_request.base.ref == 'release' ||
        startsWith(github.event.pull_request.base.ref, 'epic/'))) ||
      (github.event_name == 'push' &&
       (startsWith(github.ref, 'refs/heads/release') || startsWith(github.ref, 'refs/heads/epic/')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Mark implemented + auto-close linked issues (integration merge)
        uses: actions/github-script@v8
        with:
          script: |
            const isPR = !!context.payload.pull_request;
            const pr = context.payload.pull_request;
            const baseRef = isPR ? pr.base.ref : (context.ref || '').replace('refs/heads/', '');
            const isIntegration =
              !!baseRef &&
              (baseRef === 'release' ||
                baseRef.startsWith('release-') ||
                baseRef.startsWith('release/') ||
                baseRef.startsWith('epic/') ||
                baseRef.startsWith('epic-'));
            if (!isIntegration || baseRef === 'main') {
              core.info(`Not a PLATE integration merge (base=${baseRef}); skipping.`);
              return;
            }

            // Parse Closes/Fixes/Resolves (body only; title must not carry keywords)
            const linked = new Set();
            if (isPR) {
              const body = pr.body || '';
              const closingPattern =
                /\b(closes?|closed|fixe?s?|fixed|resolve[sd]?)\s+(?:https?:\/\/github\.com\/[^/\s]+\/[^/\s]+\/issues\/)?#?(\d+)\b/gi;
              let m;
              while ((m = closingPattern.exec(body)) !== null) {
                linked.add(parseInt(m[2], 10));
              }
            }
            if (linked.size === 0) {
              core.info('No linked issues via closing keywords; nothing to label/close.');
              return;
            }

            const SKIP_CLOSE = new Set(['Epic', 'Task', 'Release']);
            const label = 'status:implemented';
            const prNumber = isPR ? pr.number : 0;
            const closed = [];
            const labeled = [];
            const skipped = [];

            for (const num of linked) {
              let issue;
              try {
                const resp = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                });
                issue = resp.data;
              } catch (e) {
                core.warning(`Could not fetch #${num}: ${e.message}`);
                continue;
              }

              // Always attempt status:implemented on open issues
              if (issue.state === 'open') {
                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: num,
                    labels: [label],
                  });
                  labeled.push(num);
                  core.info(`Added ${label} to #${num} (merged to ${baseRef}).`);
                } catch (e) {
                  core.warning(`Failed to label #${num}: ${e.message}`);
                }
              } else {
                core.info(`#${num} already ${issue.state}; skip label/close.`);
                skipped.push({ number: num, reason: `already_${issue.state}` });
                continue;
              }

              const names = (issue.labels || []).map((l) =>
                typeof l === 'string' ? l : l.name
              );
              const skipHit = names.filter((n) => SKIP_CLOSE.has(n));
              if (skipHit.length) {
                core.info(`Skip auto-close #${num}: types ${skipHit.join(',')}`);
                skipped.push({ number: num, reason: `skip_type:${skipHit.join(',')}` });
                continue;
              }

              const commentBody = [
                `Auto-closed after merge of #${prNumber} into \`${baseRef}\` (PLATE integration-branch close, #427).`,
                '',
                '<!-- PLATE-INTEGRATION-CLOSE:BEGIN -->',
                JSON.stringify({ pr: prNumber, base: baseRef, reason: 'closing_keyword' }),
                '<!-- PLATE-INTEGRATION-CLOSE:END -->',
                '',
              ].join('\n');

              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                  body: commentBody,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                  state: 'closed',
                  state_reason: 'completed',
                });
                closed.push(num);
                core.info(`Closed #${num} after merge to ${baseRef}.`);
              } catch (e) {
                core.warning(`Failed to close #${num}: ${e.message}`);
              }
            }

            core.info(
              `Integration close audit: labeled=[${labeled.join(',')}] closed=[${closed.join(',')}] skipped=${JSON.stringify(skipped)}`
            );
