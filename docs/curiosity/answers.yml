'319':
  answers:
  - agent_actions: []
    answer_text: 'Research summary:


      - Canonical standing target: one open `Release` issue titled `Next Release`,
      not separate Major/Minor/Patch release issues.

      - Initial standing branch creation belongs to `gh plate bootstrap --apply`;
      packaging rollover belongs to `gh plate release finalize`; repair should be
      a dedicated idempotent init/repair command.

      - Healthy vs never-initialized vs drifted state is now documented in `docs/research/release-track-bootstrap-and-repair.md`.

      - Follow-up implementation gap is tracked in #320.


      Documentation PR: #321'
