'326':
  answers:
  - agent_actions: []
    answer_text: 'Provisional recommendation: treat `answer_signal` as an explicit
      structured section on the Question body, preserved in human-readable markdown
      but constrained to parseable line items. The engine should evaluate closure
      against those declared criteria plus cited evidence from the accumulated answer
      history; heuristic keywords like done/complete should never close a Question
      on their own. In practice, this means Contemplation Engine v2 should read the
      `Answer signal` section verbatim, normalize it into line-oriented criteria,
      and require each criterion to be satisfied or intentionally superseded before
      closing.'
