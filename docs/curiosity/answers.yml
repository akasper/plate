'327':
  answers:
  - agent_actions: []
    answer_text: 'Provisional recommendation: keep `.plate` at the repository root.
      The existing epic, design, and implementation language all define it as repo-owned
      root configuration, which makes it visible to both humans and tooling without
      coupling it to GitHub-only metadata under `.github/`. Future CLI, MCP, bootstrap,
      and extension flows should therefore continue treating root placement as the
      canonical location, with `.github/` reserved for GitHub-native automation artifacts
      rather than core project configuration.'
    answered_by: copilot-agent
