extensions_registry:
  version: "0.1"
  purpose: "Track optional PLATE extensions without making every project carry every advanced artifact."
  compatibility:
    minimum_process_version: "0.6"
    migration_required_when_incompatible: true

extensions:
  - id: "marketing-site"
    status: "available"
    description: "Adds public-facing site configuration, claim review, analytics policy, and launch checklists."
    artifacts:
      - ".agentic/marketing.yml"
      - "docs/marketing/**"
      - "site/**"
      - ".github/workflows/pages.yml"
    default_enabled: false
    human_approval_required: true
    release_checks:
      - id: "marketing-copy-reviewed"
        description: "All marketing claims in .agentic/marketing.yml must be reviewed and approved before a release goes public."
        required: true
        human_approval_required: true
      - id: "analytics-consent-verified"
        description: "Analytics and cookie consent configuration must be verified against current legal requirements."
        required: false
        human_approval_required: true
  - id: "migration"
    status: "available"
    description: "Adds adoption artifacts for existing projects moving into PLATE."
    artifacts:
      - ".agentic/migration.yml"
      - "docs/migration/**"
      - ".github/ISSUE_TEMPLATE/migration-task.yml"
    default_enabled: false
    human_approval_required: true
  - id: "wiki-sync"
    status: "available"
    description: "Synchronizes scoped repository documentation into the GitHub wiki after merged Feature PRs."
    artifacts:
      - ".github/workflows/sync-wiki-on-merge.yml"
      - "docs/wiki/**"
    default_enabled: false
    human_approval_required: true
    enablement_variable: "PLATE_WIKI_SYNC_ENABLED"
    required_secret: "WIKI_TOKEN"
    rollback: "Disable the repository variable and revert the wiki sync commit if needed."
  - id: "question-handling"
    status: "available"
    description: "Packages question-specific automation: issue template, slash-command batching, and answer-sync checks."
    artifacts:
      - ".github/ISSUE_TEMPLATE/question.yml"
      - ".github/workflows/question-handling.yml"
      - "scripts/question_batch.sh"
      - "scripts/QuestionBatch.ps1"
      - "AGENTS.md"
      - ".agentic/skills.yml"
    default_enabled: true
    human_approval_required: false
    rollback: "Revert the question-handling workflow/template/scripts and remove the Question label from active use."
  - id: "custom-agents"
    status: "available"
    description: "Packages custom Copilot agents as .agent.md files in .github/agents/ for team-wide AI assistants."
    artifacts:
      - ".github/agents/*.agent.md"
      - ".agentic/skills.yml"
      - "docs/research/custom-agent-packaging.md"
    default_enabled: true
    human_approval_required: false
    rollback: "Remove agent files added by this extension from .github/agents/ and their extension registry entry. Other custom agents added independently are unaffected."
  - id: "release-ceremony"
    status: "available"
    description: "Formalises the PLATE release cycle with Release issues, fragment-based release notes, a dedicated 'release' branch, and extension-level release checks."
    artifacts:
      - ".github/ISSUE_TEMPLATE/release.yml"
      - ".agentic/releases/unreleased/"
      - "scripts/cut_release.py"
    default_enabled: true
    human_approval_required: false
    rollback: "Delete the release branch, remove the Release issue template, and revert process.yml release_rules."
    release_checks:
      - id: "release-notes-complete"
        description: "All pending release note fragments in .agentic/releases/unreleased/ must be aggregated (cut_release.py run) before tagging."
        required: true
        human_approval_required: false
      - id: "release-branch-rebased"
        description: "After a release ships, hard-reset the 'release' branch to main so integration resumes from the current main tip."
        required: true
        human_approval_required: false
      - id: "release-issue-open"
        description: "An open Release issue must exist that tracks the release intent, acceptance criteria, and sign-off."
        required: true
        human_approval_required: true
      - id: "extension-extension-sign-off"
        description: "Any extension with its own release_checks must have all required checks satisfied and human approval if required."
        required: true
        human_approval_required: true
